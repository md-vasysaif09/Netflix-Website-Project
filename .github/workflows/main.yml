name: Netflix Website CI Pipeline

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Stage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Check Website Files
        run: |
          echo "Starting build stage..."

          test -f index.html
          test -f styles.css
          test -f netflixstyles.css
          test -f scripts.js

          echo "All required website files exist!"
          echo "Build stage completed successfully!"

          
  test:
    name: Test Stage
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Check Required Files
        run: |
          echo "Checking required website files..."

          for file in index.html styles.css netflixstyles.css scripts.js; do
            if [ -f "$file" ]; then
              echo "PASS: $file exists"
            else
              echo "FAIL: $file is missing"
              exit 1
            fi
          done

      - name: Test HTML Structure
        run: |
          echo "Checking HTML structure..."

          grep -qi "<html" index.html || {
            echo "FAIL: HTML tag not found"
            exit 1
          }

          grep -qi "<head" index.html || {
            echo "FAIL: Head tag not found"
            exit 1
          }

          grep -qi "<body" index.html || {
            echo "FAIL: Body tag not found"
            exit 1
          }

          echo "PASS: Basic HTML checks completed"

      - name: Check CSS and JavaScript Content
        run: |
          for file in styles.css netflixstyles.css scripts.js; do
            if [ -s "$file" ]; then
              echo "PASS: $file is not empty"
            else
              echo "FAIL: $file is empty"
              exit 1
            fi
          done

      - name: Test Stage Completed
        run: echo "All website tests passed!"
        
  lint:
    name: Lint Stage
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Lint HTML
        run: |
          npx --yes htmlhint index.html

      - name: Lint Stage Completed
        run: echo "HTML linting completed successfully!"
