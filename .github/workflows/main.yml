name: Netflix Website CI Pipeline

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Stage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Check Website Files
        run: |
          echo "Starting Build Stage..."
          echo "Repository files:"
          ls -la

          if [ ! -f index.html ]; then
            echo "ERROR: index.html not found in repository root."
            exit 1
          fi

          echo "SUCCESS: index.html found."
          echo "Build Stage completed."

  test:
    name: Test Stage
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Validate HTML Structure
        run: |
          echo "Starting Test Stage..."

          if ! grep -Eiq '<html([[:space:]>])' index.html; then
            echo "ERROR: HTML opening tag not found."
            exit 1
          fi

          if ! grep -Eiq '<head([[:space:]>])' index.html; then
            echo "ERROR: HTML head tag not found."
            exit 1
          fi

          if ! grep -Eiq '<body([[:space:]>])' index.html; then
            echo "ERROR: HTML body tag not found."
            exit 1
          fi

          echo "SUCCESS: Basic HTML structure validated."

      - name: Check Website Assets
        run: |
          echo "Checking CSS and JavaScript references..."

          if grep -Eiq '<link[^>]+href=["'\''][^"'\'']+\.css' index.html; then
            echo "SUCCESS: CSS reference found."
          else
            echo "NOTICE: No CSS reference found in index.html."
          fi

          if grep -Eiq '<script[^>]+src=["'\''][^"'\'']+\.js' index.html; then
            echo "SUCCESS: JavaScript reference found."
          else
            echo "NOTICE: No external JavaScript reference found."
          fi

          echo "Website asset checks completed."
          
  lint:
    name: Lint Stage
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install HTMLHint
        run: npm install --no-save htmlhint

      - name: Run HTML Linter
        run: npx --no-install htmlhint index.html
        
      - name: Create Website ZIP
        run: |
          zip -r netflix-website.zip index.html styles.css netflixstyles.css scripts.js

      - name: Upload Website Artifact
        uses: actions/upload-artifact@v4
        with:
          name: netflix-website
          path: netflix-website.zip
          retention-days: 7

      - name: Lint Stage Completed
        if: success()
        run: echo "HTML linting completed successfully!"

          deploy:
    name: Deploy Website to AWS EC2
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Prepare EC2 Directory
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2_key \
            "$EC2_USER@$EC2_HOST" \
            "mkdir -p /tmp/netflix-website"

      - name: Copy Website Files to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i ~/.ssh/ec2_key \
            index.html styles.css netflixstyles.css scripts.js \
            "$EC2_USER@$EC2_HOST:/tmp/netflix-website/"

      - name: Deploy Website
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2_key \
            "$EC2_USER@$EC2_HOST" \
            "sudo cp -r /tmp/netflix-website/. /var/www/html/ &&
             sudo systemctl reload nginx"

      - name: Verify Deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          curl --fail --show-error --silent \
            "http://$EC2_HOST/" \
            -o /dev/null

          echo "Website deployed and HTTP response verified!"
