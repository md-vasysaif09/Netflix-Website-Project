name: Netflix Website CI Pipeline

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Stage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Check Website Files
        run: |
          echo "Starting build stage..."

          test -f index.html
          test -f styles.css
          test -f netflixstyles.css
          test -f scripts.js

          echo "All required website files exist!"
          echo "Build stage completed successfully!"

  test:
    name: Test Stage
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Test HTML
        run: |
          echo "Testing website HTML..."

          grep -qi "<html" index.html
          grep -qi "<head" index.html
          grep -qi "<body" index.html

          echo "HTML basic tests passed!"

      - name: Test CSS and JavaScript Files
        run: |
          test -s styles.css
          test -s netflixstyles.css
          test -s scripts.js

          echo "CSS and JavaScript files exist and are not empty!"

  lint:
    name: Lint Stage
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Lint HTML
        run: |
          npx --yes htmlhint index.html

      - name: Lint Stage Completed
        run: echo "HTML linting completed successfully!"
